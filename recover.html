<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#254e48"><title>ICHI-JAPAN Recovery</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7f5;color:#173d39;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:420px;background:white;border:1px solid #dfe8e5;border-radius:24px;padding:28px;box-shadow:0 12px 40px #163c3620}h1{margin:0 0 10px;font-size:24px}p{line-height:1.55;color:#60716e}.ok{font-weight:700;color:#173d39}</style></head><body><main class="card"><h1>กำลังกู้หน้า ICHI-JAPAN</h1><p id="status">กำลังล้างเฉพาะ Service Worker / cache ของเว็บ แล้วจะกลับหน้าแรกอัตโนมัติ…</p></main><script>(async()=>{const s=document.getElementById('status');try{if('serviceWorker'in navigator){const appScope=new URL('./',location.href).href;for(const r of await navigator.serviceWorker.getRegistrations())if(r.scope===appScope||r.scope.startsWith(appScope))await r.unregister()}if('caches'in window){for(const k of await caches.keys())if(k.startsWith('ichi-'))await caches.delete(k)}s.className='ok';s.textContent='กู้หน้าเว็บแล้ว กำลังเปิด ICHI-JAPAN ใหม่…';setTimeout(()=>location.replace('./?recovered=1590'),600)}catch(e){s.textContent='กู้ cache อัตโนมัติไม่สำเร็จ: '+e.message+' · กรุณาล้างข้อมูลเว็บไซต์ของ natiphol.github.io แล้วเปิดใหม่'}})();</script></body></html>
